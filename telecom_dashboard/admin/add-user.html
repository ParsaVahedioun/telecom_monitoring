<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>افزودن کاربر جدید</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

    <!-- SweetAlert2 برای نوتیفیکیشن -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            background-color: #f5f7fa;
        }
        #map {
          width: 100%;
          background: transparent !important; /* 👈 خیلی مهم */
        }
        .card {
            border-radius: 20px;
            box-shadow: 0 0 15px rgba(0,0,0,0.05);
        }
        #map {
            height: 300px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="card p-4">
            <h4 class="mb-4">افزودن کاربر جدید</h4>

            <form id="userForm">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">نام کاربر</label>
                        <input type="text" class="form-control" name="name" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">شماره موبایل</label>
                        <input type="text" class="form-control" name="phone" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">IP آدرس</label>
                        <input type="text" class="form-control" name="ip_address" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">منطقه</label>
                        <input type="text" class="form-control" name="region">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">پلن</label>
                        <select name="plan" class="form-select">
                            <option value="نامحدود">نامحدود</option>
                            <option value="حجمی">حجمی</option>
                            <option value="ساعتی">ساعتی</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">وضعیت فعال بودن</label>
                        <div class="form-check form-switch mt-1">
                            <input class="form-check-input" type="checkbox" name="is_active" checked>
                            <label class="form-check-label">فعال</label>
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">موقعیت روی نقشه</label>
                        <div id="map"></div>
                        <input type="hidden" name="latitude" id="latitude">
                        <input type="hidden" name="longitude" id="longitude">
                    </div>
                    <div class="col-12 text-end mt-3">
                        <button type="submit" class="btn btn-success">ثبت کاربر</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        // نقشه Leaflet
        const map = L.map('map').setView([35.6892, 51.3890], 10); // موقعیت پیش‌فرض تهران
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap',
        }).addTo(map);

        let marker;

        map.on('click', function(e) {
            const { lat, lng } = e.latlng;
            if (marker) map.removeLayer(marker);
            marker = L.marker([lat, lng]).addTo(map);
            document.getElementById('latitude').value = lat;
            document.getElementById('longitude').value = lng;
        });

        // ارسال با AJAX
        document.getElementById('userForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());
            data.is_active = !!formData.get('is_active');

            try {
                const res = await fetch('/api/users/add', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                const result = await res.json();
                if (res.ok) {
                    Swal.fire("موفق!", result.message, "success");
                    this.reset();
                    if (marker) map.removeLayer(marker);
                } else {
                    Swal.fire("خطا", result.detail || "خطا در ثبت کاربر", "error");
                }

            } catch (err) {
                Swal.fire("خطا", "ارتباط با سرور برقرار نشد.", "error");
            }
        });
    </script>
</body>
</html>
