<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>لیست کاربران</title>

  <!-- Bootstrap RTL -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/dataTables.bootstrap5.min.css">

  <style>
    body { background-color: #f5f7fa; }
    .card { border-radius: 20px; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
    table.dataTable tbody tr:hover { background-color: #eef; }
    .dt-buttons { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="card p-4">
      <h4 class="mb-4">لیست کاربران</h4>

      <table id="usersTable" class="table table-striped table-bordered" style="width:100%">
        <thead>
          <tr>
            <th>شناسه</th>
            <th>نام</th>
            <th>تلفن</th>
            <th>IP</th>
            <th>منطقه</th>
            <th>پلن</th>
            <th>وضعیت</th>
            <th>تاریخ ایجاد</th>
            <th>عملیات</th>
          </tr>
        </thead>
        <tbody>
          <!-- داده‌ها با JS پر می‌شود -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- DataTables JS -->
  <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.5/js/dataTables.bootstrap5.min.js"></script>

  <script>
    $(document).ready(function() {
      const table = $('#usersTable').DataTable({
        columns: [
          { data: 'id' },
          { data: 'name' },
          { data: 'phone' },
          { data: 'ip_address' },
          { data: 'region' },
          { data: 'plan' },
          {
            data: 'is_active',
            render: function(data) {
              return data
                ? '<span class="badge bg-success">فعال</span>'
                : '<span class="badge bg-secondary">غیرفعال</span>';
            }
          },
          {
            data: 'created_at',
            render: function(data) {
              const d = new Date(data);
              return d.toLocaleDateString('fa-IR') + ' ' + d.toLocaleTimeString('fa-IR');
            }
          },
          {
            data: null,
            orderable: false,
            render: function(row) {
              return `
                <button class="btn btn-sm btn-primary me-1" onclick="editUser(${row.id})">ویرایش</button>
                <button class="btn btn-sm btn-danger" onclick="deleteUser(${row.id})">حذف</button>
              `;
            }
          }
        ],
        responsive: true,
        language: {
          url: "https://cdn.datatables.net/plug-ins/1.13.5/i18n/fa.json"
        },
        dom: 'Bfrtip',
        buttons: [
          {
            text: 'رفرش',
            action: function () { table.ajax.reload(); }
          }
        ],
        ajax: {
          url: '/api/users/list',
          dataSrc: ''
        }
      });
    });

    function editUser(id) {
      window.location.href = `/admin/users/edit/${id}`;
    }

    function deleteUser(id) {
      if (!confirm('آیا مطمئن هستید که می‌خواهید این کاربر را حذف کنید؟')) return;
      fetch(`/api/users/delete/${id}`, { method: 'DELETE' })
        .then(res => {
          if (res.ok) {
            $('#usersTable').DataTable().ajax.reload();
            alert('کاربر حذف شد.');
          } else {
            alert('خطا در حذف کاربر');
          }
        });
    }
  </script>
</body>
</html>
